# Service-controlled reusable workflow that exercises Scruffy's hosted OIDC
# release-authority protocol in shadow-only mode. A disposable caller repository
# invokes it by an immutable full commit SHA:
#
#   uses: esbenwiberg/scruffy/.github/workflows/release-authority-shadow.yml@<full-sha>
#
# The caller must grant `id-token: write` (a called workflow cannot elevate
# beyond the caller's permissions). The Scruffy endpoint, OIDC audience, and the
# protected approval Environment are FIXED service-controlled literals and must
# never be exposed as caller inputs — an endpoint input would enable OIDC-token
# exfiltration. This workflow validates every response field needed for routing
# and never prints tokens/authorization headers/full reports/full attestations.
# Repository-owned workflow prerequisites are resolved by Scruffy at the exact
# candidate SHA (never caller inputs): a green result ships, a terminal workflow
# failure or release-authority change routes to the protected sign-off job, a
# still-pending prerequisite is retried under a bounded backoff and then fails
# closed with a rerun instruction (never entering the protected Environment), and
# an absent/unverifiable/missing/invalid prerequisite fails closed. Job summaries
# surface only the typed prerequisite evidence (required workflow paths, run
# links, run id/attempt, conclusions, changed authority paths, old/new required
# sets, and sign-off reason codes) — never the model risk findings, observations,
# or coverage gaps.
# It carries no deployment authority: it performs no application, infrastructure,
# package, image, or release deployment or publication, issues no explicit
# deployment/status/SCM write command, and holds no such write permission, so it
# creates no release, package, image, check, issue, or PR. The one unavoidable
# platform effect is that the sign-off path runs in a protected GitHub
# Environment, so GitHub itself may automatically create protected-Environment
# deployment/status audit metadata for that job; that GitHub-generated audit
# record is platform bookkeeping, not a product deployment or publication. Every
# authorization is `shadowOnly: true`.
name: Scruffy release-authority shadow

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Full 40-character lowercase candidate commit SHA.
        required: true
        type: string
      previous_release_sha:
        description: Full 40-character lowercase previous release SHA; empty only for a first release.
        required: false
        type: string
        default: ""
      artifact_digest:
        description: Artifact digest as sha256:<64 lowercase hex>, supplied by the caller's build.
        required: true
        type: string
      target_environment:
        description: Target environment; the hosted allowlist expects shadow-production.
        required: true
        type: string
      exception_rationale:
        description: Exception rationale; optional at dispatch, required and non-empty for a sign-off.
        required: false
        type: string
        default: ""
      responsibility_accepted:
        description: Explicit responsibility acceptance; must be true for a sign-off.
        required: false
        type: boolean
        default: false
    outputs:
      report_id:
        description: The hosted release report identifier.
        value: ${{ jobs.review-and-ship-authorize.outputs.report_id }}
      outcome:
        description: The report outcome (ship or sign-off-required).
        value: ${{ jobs.review-and-ship-authorize.outputs.outcome }}
      authorization_id:
        description: The terminal shadow authorization identifier, from whichever path authorized.
        value: ${{ jobs.review-and-ship-authorize.outputs.authorization_id || jobs.attest-and-authorize-exception.outputs.authorization_id }}
      signoff_used:
        description: Whether the protected sign-off path was taken.
        value: ${{ jobs.review-and-ship-authorize.outputs.outcome == 'sign-off-required' }}

# Least privilege: read-only contents as a baseline, plus id-token because every
# authority call needs a fresh short-lived OIDC token. No workflow, SCM, package,
# deployment, checks, issues, or pull-request write authority is granted.
permissions:
  contents: read
  id-token: write

jobs:
  # PRE-approval job. It carries NO GitHub Environment, so its OIDC token has no
  # `environment` claim (the hosted report request rejects a token that does).
  # It validates the complete envelope BEFORE acquiring any token, requests the
  # report, and — only for `ship` — posts the terminal authorization itself.
  review-and-ship-authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      report_id: ${{ steps.review.outputs.report_id }}
      outcome: ${{ steps.review.outputs.outcome }}
      authorization_id: ${{ steps.review.outputs.authorization_id }}
    steps:
      - name: Request report and auto-authorize ship
        id: review
        env:
          # Fixed service-controlled literals — never caller inputs.
          SCRUFFY_ENDPOINT: https://scruffy-shadow.gentlebeach-f5d64525.swedencentral.azurecontainerapps.io
          SCRUFFY_AUDIENCE: scruffy-release
          # Caller-supplied envelope fields, passed through the environment so no
          # untrusted value is interpolated into the shell body.
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREVIOUS_RELEASE_SHA: ${{ inputs.previous_release_sha }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -Eeuo pipefail
          umask 077

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fail() { echo "release-authority-shadow: $1" >&2; exit 1; }

          # Validate the RUNNER-PROVIDED OIDC token-request URL (never the JWT
          # issuer). Permit only an HTTPS host whose parsed authority is a genuine
          # non-empty subdomain of `.actions.githubusercontent.com`, with no
          # userinfo/credentials and no explicit port. Rejects HTTP, malformed,
          # bare, sibling, suffix-confusion, and attacker-controlled hosts before
          # the request token is ever transmitted.
          assert_trusted_oidc_request_url() {
            local url="$1" rest authority host label
            case "$url" in
              https://*) : ;;
              *) fail "OIDC token request URL must use HTTPS" ;;
            esac
            rest="${url#https://}"
            authority="${rest%%/*}"
            authority="${authority%%\?*}"
            authority="${authority%%#*}"
            case "$authority" in
              *@*) fail "OIDC token request URL must not contain credentials" ;;
            esac
            case "$authority" in
              *:*) fail "OIDC token request URL must not specify a port" ;;
            esac
            host="$authority"
            case "$host" in
              *[!a-zA-Z0-9.-]*) fail "OIDC token request host contains invalid characters" ;;
            esac
            case "$host" in
              .*|*.|*..*) fail "OIDC token request host is malformed" ;;
            esac
            case "$host" in
              *.actions.githubusercontent.com) : ;;
              *) fail "OIDC token request host is not a subdomain of actions.githubusercontent.com" ;;
            esac
            label="${host%.actions.githubusercontent.com}"
            [[ -n "$label" ]] \
              || fail "OIDC token request host is not a subdomain of actions.githubusercontent.com"
          }

          # --- 1. Validate the COMPLETE envelope before requesting a token ---
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "candidate_sha must be a full 40-character lowercase SHA"
          if [[ -n "$PREVIOUS_RELEASE_SHA" ]]; then
            [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || fail "previous_release_sha must be empty or a full 40-character lowercase SHA"
          fi
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || fail "artifact_digest must be sha256:<64 lowercase hex>"
          [[ "$TARGET_ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || fail "target_environment is malformed"
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || fail "repository is malformed"

          # Build the exact envelope ONCE and reuse it verbatim for the report
          # request and any authorization, so they remain byte-for-byte bound.
          envelope_file="$workdir/envelope.json"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg previousReleaseSha "$PREVIOUS_RELEASE_SHA" \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg targetEnvironment "$TARGET_ENVIRONMENT" \
            '{repository: $repository, candidateSha: $candidateSha, previousReleaseSha: (if $previousReleaseSha == "" then null else $previousReleaseSha end), artifactDigest: $artifactDigest, targetEnvironment: $targetEnvironment}' \
            > "$envelope_file"

          # --- 2. Acquire a short-lived OIDC token from the runner endpoint ---
          # The runner-provided request endpoint is a REGIONAL Actions service
          # host under `*.actions.githubusercontent.com` (e.g.
          # `pipelines.actions.githubusercontent.com`); it is NOT the JWT issuer,
          # which the hosted verifier fixes to token.actions.githubusercontent.com.
          # Bound the request host to a genuine subdomain of the trusted zone
          # BEFORE the request token is ever sent, so it can never be exfiltrated.
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC token request URL is unavailable; the caller must grant id-token: write}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC request token is unavailable}"
          assert_trusted_oidc_request_url "$ACTIONS_ID_TOKEN_REQUEST_URL"

          # The request bearer and the resulting JWT are written to
          # permission-restricted curl config files (umask 077) so they never
          # appear in process arguments, job outputs, or logs.
          oidc_cfg="$workdir/oidc.cfg"
          printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$oidc_cfg"
          token_response="$workdir/token.json"
          curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            --config "$oidc_cfg" --header "Accept: application/json" \
            --output "$token_response" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SCRUFFY_AUDIENCE}" \
            || fail "OIDC token request failed"
          jwt="$(jq -er '.value' < "$token_response")" || fail "OIDC token response was malformed"
          auth_cfg="$workdir/auth.cfg"
          printf 'header = "Authorization: Bearer %s"\n' "$jwt" > "$auth_cfg"
          unset jwt

          # --- 3. Request the hosted release report for the exact envelope ---
          # A prerequisite-aware hosted service does NOT return an approvable report
          # for a candidate whose repository-owned required workflows are not yet a
          # result. It answers HTTP 409 instead, distinguished by a `retryable` flag:
          #   * retryable:true  — the required workflows are still PENDING (evidence
          #     that is not a result yet). Retry the SAME request under a bounded
          #     backoff; if it never settles, fail closed with an explicit rerun
          #     instruction. A pending prerequisite is NEVER routed to the protected
          #     sign-off Environment.
          #   * retryable:false — the prerequisite is ABSENT or UNVERIFIABLE, or the
          #     repository configuration is MISSING/INVALID. None of those is a result
          #     a human may approve, so fail closed immediately (request a fresh report
          #     after fixing the cause). Terminal workflow FAILURE and release-AUTHORITY
          #     CHANGE are, by contrast, real 200 `sign-off-required` results.
          # Any other non-200 (including a 503 infrastructure abstain) also fails closed.
          report_file="$workdir/report.json"
          max_attempts=6      # bounded: the retry loop always terminates
          backoff=10          # seconds; doubles each pending retry, capped
          backoff_cap=60
          attempt=0
          while : ; do
            attempt=$((attempt + 1))
            status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
              --connect-timeout 10 --max-time 30 \
              --config "$auth_cfg" --header "Accept: application/json" --header "Content-Type: application/json" \
              --data-binary "@$envelope_file" \
              --output "$report_file" --write-out '%{http_code}' \
              "${SCRUFFY_ENDPOINT}/v1/release-reports")" || fail "release report request failed"
            [[ "$status" == "200" ]] && break
            if [[ "$status" == "409" ]]; then
              retryable="$(jq -r 'if .retryable == true then "true" else "false" end' < "$report_file" 2>/dev/null || echo "false")"
              reason_codes="$(jq -r '(.reasonCodes // []) | join(", ")' < "$report_file" 2>/dev/null || echo "")"
              [[ -n "$reason_codes" ]] || reason_codes="unspecified"
              if [[ "$retryable" == "true" ]]; then
                # Pending prerequisites: bounded retry, then fail closed. Never approvable.
                if (( attempt >= max_attempts )); then
                  {
                    echo "### Scruffy shadow release authority — prerequisites pending"
                    echo "- required workflows still pending after ${attempt} attempts (${reason_codes})"
                    echo "- rerun this workflow once the required workflows complete"
                  } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  fail "release prerequisites still pending after ${attempt} attempts (${reason_codes}); rerun once the required workflows complete"
                fi
                echo "release-authority-shadow: prerequisites pending (${reason_codes}); retry ${attempt}/${max_attempts} in ${backoff}s" >&2
                sleep "$backoff"
                if (( backoff < backoff_cap )); then backoff=$((backoff * 2)); fi
                if (( backoff > backoff_cap )); then backoff=$backoff_cap; fi
                continue
              fi
              # Non-retryable fail-closed prerequisite: absent / unverifiable / config missing / invalid.
              {
                echo "### Scruffy shadow release authority — prerequisites not approvable"
                echo "- release prerequisites cannot be approved (${reason_codes})"
                echo "- fix the repository configuration or required-workflow evidence, then request a fresh report"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fail "release prerequisites cannot be approved (${reason_codes}); request a fresh report after fixing the cause"
            fi
            echo "release-authority-shadow: report request returned HTTP ${status}: $(jq -r '.error // "request failed"' < "$report_file" 2>/dev/null || echo "request failed")" >&2
            exit 1
          done

          report_id="$(jq -er '.reportId' < "$report_file")" || fail "report response is missing reportId"
          outcome="$(jq -er '.decision.outcome' < "$report_file")" || fail "report response is missing an outcome"
          [[ "$report_id" =~ ^rr_[0-9a-f]{64}$ ]] || fail "report id is malformed"
          jq -e --slurpfile expected "$envelope_file" '.subject == $expected[0]' < "$report_file" > /dev/null \
            || fail "report subject does not match the requested envelope"

          {
            echo "report_id=$report_id"
            echo "outcome=$outcome"
          } >> "$GITHUB_OUTPUT"

          # Bounded, non-secret prerequisite summary. It surfaces ONLY the typed
          # workflow-prerequisite evidence and identity — report/candidate/artifact,
          # the required-workflow sets, each workflow's exact run link/id/attempt/
          # status/conclusion (failed ones flagged prominently), the changed release-
          # authority paths, and the sign-off reason codes. It reads a fixed set of
          # fields with `jq`, so it never emits the OIDC token, an Authorization
          # header, the unrestricted report JSON, or the model risk findings /
          # observations / coverage gaps. Arrays are sliced to a bounded length.
          if jq -e '.prerequisite != null' < "$report_file" > /dev/null 2>&1; then
            prereq_md="$workdir/prereq.md"
            jq -r --argjson maxwf 200 '
              def code($s): "`" + ($s | tostring) + "`";
              def wfset($a): if (($a // []) | length) == 0 then "(none)" else ([($a // [])[] | code(.)] | join(", ")) end;
              . as $r | $r.prerequisite as $p
              | ( [ "### Scruffy shadow release authority",
                    "- report: " + code($r.reportId),
                    "- candidate: " + code($r.subject.candidateSha),
                    "- artifact: " + code($r.subject.artifactDigest),
                    "- previous release: " + code($r.subject.previousReleaseSha // "(first-release)"),
                    "- outcome: " + code($r.decision.outcome),
                    "- prerequisite aggregate: " + code($p.aggregate.outcome) + " (" + code($p.aggregate.reasonCode) + ")",
                    "- release authority: " + code($p.authority.reasonCode) + " (firstAdoption=" + code($p.authority.firstAdoption) + ", configChanged=" + code($p.authority.configChanged) + ")" ]
                  + (if ($r.decision.outcome == "sign-off-required") and (($r.decision.reasons | length) > 0)
                       then [ "- sign-off requested because: " + ([$r.decision.reasons[] | code(.)] | join(", ")) ] else [] end)
                  + [ "- previous required workflows: " + wfset($p.previousConfig.requiredWorkflows),
                      "- current required workflows: " + wfset($p.candidateConfig.requiredWorkflows) ]
                  + (if (($p.authority.addedRequiredWorkflows | length) + ($p.authority.removedRequiredWorkflows | length)) > 0
                       then [ "- required-workflow set change: added " + wfset($p.authority.addedRequiredWorkflows) + "; removed " + wfset($p.authority.removedRequiredWorkflows) ] else [] end)
                  + (if ($p.authority.changedAuthorityPaths | length) > 0
                       then [ "- changed release-authority paths:" ] + [ $p.authority.changedAuthorityPaths[:$maxwf][] | "  - " + code(.) ] else [] end)
                  + [ "- required workflow evidence:" ]
                  + [ $p.workflows[:$maxwf][]
                      | "  - " + (if .state == "terminal-failed" then "⚠️ FAILED " elif .state != "passed" then "⚠️ " else "" end)
                        + code(.workflowPath) + " — state " + code(.state)
                        + (if .evidence
                             then " — run " + code(.evidence.runId) + " attempt " + code(.evidence.runAttempt)
                                  + " status " + code(.evidence.status) + " conclusion " + code(.evidence.conclusion // "null")
                                  + " — " + (.evidence.url)
                             else "" end) ]
                  + (if ($p.workflows | length) > $maxwf then [ "  - … " + code(($p.workflows | length) - $maxwf) + " more workflows (truncated)" ] else [] end)
                  | .[] )
            ' < "$report_file" > "$prereq_md" || fail "failed to render the prerequisite summary"
            cat "$prereq_md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            {
              echo "### Scruffy shadow release authority"
              echo "- report: \`${report_id}\`"
              echo "- outcome: \`${outcome}\`"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          # --- 4. Route strictly on the validated outcome ---
          case "$outcome" in
            ship)
              # Automatic terminal shadow authorization with the exact envelope
              # and NO attestation.
              auth_body="$workdir/auth-body.json"
              jq -cn --slurpfile envelope "$envelope_file" \
                '{envelope: $envelope[0], attestationId: null}' > "$auth_body"
              auth_file="$workdir/authorization.json"
              status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
                --connect-timeout 10 --max-time 30 \
                --config "$auth_cfg" --header "Accept: application/json" --header "Content-Type: application/json" \
                --data-binary "@$auth_body" \
                --output "$auth_file" --write-out '%{http_code}' \
                "${SCRUFFY_ENDPOINT}/v1/release-reports/${report_id}/authorizations")" \
                || fail "ship authorization failed"
              if [[ "$status" != "201" ]]; then
                echo "release-authority-shadow: ship authorization returned HTTP ${status}: $(jq -r '.error // "request failed"' < "$auth_file" 2>/dev/null || echo "request failed")" >&2
                exit 1
              fi
              authorization_id="$(jq -er '.authorizationId' < "$auth_file")" || fail "authorization response is missing an id"
              [[ "$authorization_id" =~ ^auth_[0-9a-f]{64}$ ]] || fail "authorization id is malformed"
              jq -e --slurpfile expected "$envelope_file" --arg reportId "$report_id" \
                '.reportId == $reportId and .envelope == $expected[0] and .outcome == "ship" and .attestationId == null and .shadowOnly == true' \
                < "$auth_file" > /dev/null \
                || fail "ship authorization did not match the exact report, envelope, or shadow-only contract"
              echo "authorization_id=$authorization_id" >> "$GITHUB_OUTPUT"
              echo "- authorization: \`${authorization_id}\` (automatic ship)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              ;;
            sign-off-required)
              # Hand off to the protected Environment job; no authorization here.
              echo "- routing to the protected sign-off Environment" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              ;;
            stop|indeterminate)
              fail "report outcome '${outcome}' never authorizes"
              ;;
            *)
              fail "unknown report outcome '${outcome}'"
              ;;
          esac

  # Protected exception job. It runs ONLY for an exact `sign-off-required`
  # outcome, declares the fixed protected Environment (which pauses for a real
  # GitHub reviewer), and — after the gate — acquires an Environment-scoped OIDC
  # token whose identity carries the approval Environment claim. Attestation and
  # terminal authorization run in this SAME job so they share one workflow
  # identity, exactly as the service requires. Declaring this Environment makes
  # GitHub automatically record deployment/status audit metadata for the job
  # (a deployment record plus waiting/queued/in_progress/success statuses); that
  # is GitHub's own bookkeeping, not a product deployment, and this job still
  # issues no deployment/status write command and holds no deployment permission.
  attest-and-authorize-exception:
    needs: review-and-ship-authorize
    if: needs.review-and-ship-authorize.outputs.outcome == 'sign-off-required'
    runs-on: ubuntu-latest
    environment: scruffy-production-signoff
    permissions:
      contents: read
      id-token: write
    outputs:
      authorization_id: ${{ steps.signoff.outputs.authorization_id }}
    steps:
      - name: Attest and authorize the sign-off exception
        id: signoff
        env:
          SCRUFFY_ENDPOINT: https://scruffy-shadow.gentlebeach-f5d64525.swedencentral.azurecontainerapps.io
          SCRUFFY_AUDIENCE: scruffy-release
          OUTCOME: ${{ needs.review-and-ship-authorize.outputs.outcome }}
          REPORT_ID: ${{ needs.review-and-ship-authorize.outputs.report_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREVIOUS_RELEASE_SHA: ${{ inputs.previous_release_sha }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXCEPTION_RATIONALE: ${{ inputs.exception_rationale }}
          RESPONSIBILITY_ACCEPTED: ${{ inputs.responsibility_accepted }}
        run: |
          set -Eeuo pipefail
          umask 077

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fail() { echo "release-authority-shadow: $1" >&2; exit 1; }

          # Validate the RUNNER-PROVIDED OIDC token-request URL (never the JWT
          # issuer). Permit only an HTTPS host whose parsed authority is a genuine
          # non-empty subdomain of `.actions.githubusercontent.com`, with no
          # userinfo/credentials and no explicit port. Rejects HTTP, malformed,
          # bare, sibling, suffix-confusion, and attacker-controlled hosts before
          # the request token is ever transmitted.
          assert_trusted_oidc_request_url() {
            local url="$1" rest authority host label
            case "$url" in
              https://*) : ;;
              *) fail "OIDC token request URL must use HTTPS" ;;
            esac
            rest="${url#https://}"
            authority="${rest%%/*}"
            authority="${authority%%\?*}"
            authority="${authority%%#*}"
            case "$authority" in
              *@*) fail "OIDC token request URL must not contain credentials" ;;
            esac
            case "$authority" in
              *:*) fail "OIDC token request URL must not specify a port" ;;
            esac
            host="$authority"
            case "$host" in
              *[!a-zA-Z0-9.-]*) fail "OIDC token request host contains invalid characters" ;;
            esac
            case "$host" in
              .*|*.|*..*) fail "OIDC token request host is malformed" ;;
            esac
            case "$host" in
              *.actions.githubusercontent.com) : ;;
              *) fail "OIDC token request host is not a subdomain of actions.githubusercontent.com" ;;
            esac
            label="${host%.actions.githubusercontent.com}"
            [[ -n "$label" ]] \
              || fail "OIDC token request host is not a subdomain of actions.githubusercontent.com"
          }

          # --- 1. Re-establish the sign-off preconditions inside the gate ---
          [[ "$OUTCOME" == "sign-off-required" ]] || fail "protected job entered for a non sign-off outcome"
          [[ "$REPORT_ID" =~ ^rr_[0-9a-f]{64}$ ]] || fail "report id from the review job is malformed"
          rationale_trimmed="$(printf '%s' "$EXCEPTION_RATIONALE" | tr -d '[:space:]')"
          [[ -n "$rationale_trimmed" ]] || fail "exception_rationale must be non-empty for a sign-off"
          [[ "$RESPONSIBILITY_ACCEPTED" == "true" ]] || fail "responsibility_accepted must be true for a sign-off"
          # Responsibility accepter is the runner-supplied actor identity, never
          # any caller-supplied reviewer text.
          [[ -n "$GITHUB_ACTOR" ]] || fail "runner actor login is unavailable"
          [[ "$GITHUB_ACTOR_ID" =~ ^[0-9]+$ ]] || fail "runner actor id is unavailable"

          # Re-validate and rebuild the exact same envelope.
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "candidate_sha must be a full 40-character lowercase SHA"
          if [[ -n "$PREVIOUS_RELEASE_SHA" ]]; then
            [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "previous_release_sha is malformed"
          fi
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "artifact_digest is malformed"
          [[ "$TARGET_ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail "target_environment is malformed"

          envelope_file="$workdir/envelope.json"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg previousReleaseSha "$PREVIOUS_RELEASE_SHA" \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg targetEnvironment "$TARGET_ENVIRONMENT" \
            '{repository: $repository, candidateSha: $candidateSha, previousReleaseSha: (if $previousReleaseSha == "" then null else $previousReleaseSha end), artifactDigest: $artifactDigest, targetEnvironment: $targetEnvironment}' \
            > "$envelope_file"

          # --- 2. Acquire the OIDC token AFTER the Environment gate ---
          # The runner request endpoint is a REGIONAL Actions service host under
          # `*.actions.githubusercontent.com`, distinct from the fixed JWT issuer
          # token.actions.githubusercontent.com. Bound the request host to a
          # genuine subdomain of the trusted zone before the request token is sent.
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC token request URL is unavailable; the caller must grant id-token: write}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC request token is unavailable}"
          assert_trusted_oidc_request_url "$ACTIONS_ID_TOKEN_REQUEST_URL"
          oidc_cfg="$workdir/oidc.cfg"
          printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$oidc_cfg"
          token_response="$workdir/token.json"
          curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            --config "$oidc_cfg" --header "Accept: application/json" \
            --output "$token_response" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SCRUFFY_AUDIENCE}" \
            || fail "OIDC token request failed"
          jwt="$(jq -er '.value' < "$token_response")" || fail "OIDC token response was malformed"
          auth_cfg="$workdir/auth.cfg"
          printf 'header = "Authorization: Bearer %s"\n' "$jwt" > "$auth_cfg"
          unset jwt

          # --- 3. Post the attestation with the runner actor as accepter ---
          att_body="$workdir/attest-body.json"
          jq -cn \
            --arg rationale "$EXCEPTION_RATIONALE" \
            --arg login "$GITHUB_ACTOR" \
            --arg id "$GITHUB_ACTOR_ID" \
            '{rationale: $rationale, responsibilityAccepted: true, responsibilityAccepter: {login: $login, id: $id}}' \
            > "$att_body"
          att_file="$workdir/attestation.json"
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            --config "$auth_cfg" --header "Accept: application/json" --header "Content-Type: application/json" \
            --data-binary "@$att_body" \
            --output "$att_file" --write-out '%{http_code}' \
            "${SCRUFFY_ENDPOINT}/v1/release-reports/${REPORT_ID}/attestations")" \
            || fail "attestation request failed"
          if [[ "$status" != "201" ]]; then
            echo "release-authority-shadow: attestation returned HTTP ${status}: $(jq -r '.error // "request failed"' < "$att_file" 2>/dev/null || echo "request failed")" >&2
            exit 1
          fi
          attestation_id="$(jq -er '.attestationId' < "$att_file")" || fail "attestation response is missing an id"
          [[ "$attestation_id" =~ ^ra_[0-9a-f]{64}$ ]] || fail "attestation id is malformed"
          jq -e --slurpfile expected "$envelope_file" --arg reportId "$REPORT_ID" \
            '.reportId == $reportId and .envelope == $expected[0]' < "$att_file" > /dev/null \
            || fail "attestation did not bind the exact report and envelope"

          # --- 4. Terminal shadow authorization in the SAME job/identity ---
          auth_body="$workdir/auth-body.json"
          jq -cn --slurpfile envelope "$envelope_file" --arg attestationId "$attestation_id" \
            '{envelope: $envelope[0], attestationId: $attestationId}' > "$auth_body"
          auth_file="$workdir/authorization.json"
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            --config "$auth_cfg" --header "Accept: application/json" --header "Content-Type: application/json" \
            --data-binary "@$auth_body" \
            --output "$auth_file" --write-out '%{http_code}' \
            "${SCRUFFY_ENDPOINT}/v1/release-reports/${REPORT_ID}/authorizations")" \
            || fail "sign-off authorization failed"
          if [[ "$status" != "201" ]]; then
            echo "release-authority-shadow: sign-off authorization returned HTTP ${status}: $(jq -r '.error // "request failed"' < "$auth_file" 2>/dev/null || echo "request failed")" >&2
            exit 1
          fi
          authorization_id="$(jq -er '.authorizationId' < "$auth_file")" || fail "authorization response is missing an id"
          [[ "$authorization_id" =~ ^auth_[0-9a-f]{64}$ ]] || fail "authorization id is malformed"
          jq -e --slurpfile expected "$envelope_file" \
            --arg reportId "$REPORT_ID" --arg attestationId "$attestation_id" \
            '.reportId == $reportId and .envelope == $expected[0] and .outcome == "sign-off-required" and .attestationId == $attestationId and .shadowOnly == true' \
            < "$auth_file" > /dev/null \
            || fail "sign-off authorization did not match the exact report, envelope, attestation, or shadow-only contract"

          echo "authorization_id=$authorization_id" >> "$GITHUB_OUTPUT"
          {
            echo "### Scruffy shadow sign-off authorization"
            echo "- report: \`${REPORT_ID}\`"
            echo "- attestation: \`${attestation_id}\`"
            echo "- authorization: \`${authorization_id}\`"
            echo "- responsibility accepter: \`${GITHUB_ACTOR}\`"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
